name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Prepare deployment target
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}" ]; then
            echo "PROJECT_NAME=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}" >> "$GITHUB_ENV"
          else
            echo "PROJECT_NAME=hytera-bd" >> "$GITHUB_ENV"
          fi
          echo "Deploying to Cloudflare Pages project: $(printenv PROJECT_NAME)"

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy . --project-name "$PROJECT_NAME" --branch "${{ github.ref_name }}"
